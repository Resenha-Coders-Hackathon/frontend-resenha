name: Vue & TypeScript CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint (oxlint)
      run: npx oxlint .

    - name: Lint (eslint)
      run: npx eslint .

    - name: Type-check and build
      run: npm run build
